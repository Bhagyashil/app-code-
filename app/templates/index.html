<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Challenge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .emoji { font-size: 52px; margin-bottom: 12px; }

    h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* ── Inputs ── */
    .input-group { margin-bottom: 20px; text-align: left; }

    label {
      display: block;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.3s, background 0.3s;
    }

    input::placeholder { color: rgba(255,255,255,0.3); }

    input:focus {
      border-color: #e94560;
      background: rgba(255,255,255,0.12);
    }

    /* ── Math box ── */
    .math-box {
      background: linear-gradient(135deg, #e94560, #c62a47);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .math-box p {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .math-question {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* ── Button ── */
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #e94560, #c62a47);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233,69,96,0.5);
    }

    button:active { transform: translateY(0); }

    /* ── Message ── */
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .message.error {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff6b6b;
    }

    .message.wrong {
      background: rgba(255,165,0,0.15);
      border: 1px solid rgba(255,165,0,0.3);
      color: #ffa500;
    }

    /* ── Celebration overlay ── */
    #celebration {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }

    #celebration.show { display: flex; }

    .celebrate-emoji { font-size: 80px; animation: bounce 0.6s infinite alternate; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-20px); }
    }

    .celebrate-title {
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      margin: 20px 0 10px;
      text-shadow: 0 0 30px rgba(233,69,96,0.8);
    }

    .celebrate-name {
      color: #e94560;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .celebrate-sub {
      color: rgba(255,255,255,0.6);
      font-size: 18px;
      margin-bottom: 40px;
    }

    .try-again {
      padding: 14px 36px;
      background: linear-gradient(135deg, #e94560, #c62a47);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: auto;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .try-again:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233,69,96,0.5);
    }

    /* ── Confetti ── */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      z-index: 99;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(-10px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ── Stars bg ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.1; }
      to   { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <!-- Stars background -->
  <div class="stars" id="stars"></div>

  <!-- Login Card -->
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Welcome Challenge</h1>
    <p class="subtitle">Prove you're human — solve the math!</p>

    <div class="input-group">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
    </div>

    <div class="math-box">
      <p>🧮 Solve this to continue:</p>
      <div class="math-question">{{ num1 }} + {{ num2 }} = ?</div>
    </div>

    <div class="input-group">
      <label>Your Answer</label>
      <input type="number" id="answerInput" placeholder="Type your answer..." />
    </div>

    <button onclick="submitAnswer()">🎯 Submit & Enter</button>

    <div class="message" id="message"></div>
  </div>

  <!-- Celebration Screen -->
  <div id="celebration">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-title">Congratulations!</div>
    <div class="celebrate-name" id="celebrateName"></div>
    <div class="celebrate-sub">You solved it! You're amazing! 🌟</div>
    <button class="try-again" onclick="tryAgain()">🔄 Try Again</button>
  </div>

  <script>
   const CORRECT_ANSWER = parseInt("{{ answer }}");

    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 3 + 1;
      star.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 3}s;
        animation-duration: ${2 + Math.random() * 3}s;
      `;
      starsContainer.appendChild(star);
    }

    // Submit answer
    async function submitAnswer() {
      const name = document.getElementById('nameInput').value.trim();
      const userAnswer = document.getElementById('answerInput').value.trim();
      const msgEl = document.getElementById('message');

      msgEl.style.display = 'none';
      msgEl.className = 'message';

      const res = await fetch('/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, user_answer: userAnswer, correct_answer: CORRECT_ANSWER })
      });

      const data = await res.json();

      if (data.status === 'success') {
        celebrate(data.name);
      } else {
        msgEl.textContent = data.message;
        msgEl.classList.add(data.status === 'wrong' ? 'wrong' : 'error');
        msgEl.style.display = 'block';
      }
    }

    // Celebration
    function celebrate(name) {
      document.getElementById('celebrateName').textContent = `🎊 Welcome, ${name}! 🎊`;
      document.getElementById('celebration').classList.add('show');
      launchConfetti();
    }

    // Confetti
    function launchConfetti() {
      const colors = ['#e94560','#f6c90e','#3ec70b','#0dceda','#bf5af2','#ff9f0a'];
      for (let i = 0; i < 120; i++) {
        setTimeout(() => {
          const piece = document.createElement('div');
          piece.classList.add('confetti-piece');
          piece.style.cssText = `
            left: ${Math.random() * 100}vw;
            top: -10px;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            width: ${6 + Math.random() * 8}px;
            height: ${6 + Math.random() * 8}px;
            animation-duration: ${2 + Math.random() * 2}s;
            animation-delay: ${Math.random() * 1.5}s;
            border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
          `;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4000);
        }, i * 30);
      }
    }

    // Try again → reload page
    function tryAgain() {
      window.location.reload();
    }

    // Allow Enter key
    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') submitAnswer();
    });
  </script>
</body>
</html>
